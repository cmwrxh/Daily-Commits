name: Daily Busy-Mode Commit

on:
  schedule:
    - cron: '0 8 * * 1-6'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true  # Critical for push!

      - name: Generate daily content
        run: |
          TODAY=$(date '+%Y-%m-%d')

          QUOTES=( "Progress beats perfection — showing up today counts." "One small commit > zero. You're doing great, Alenti." "Busy day? Still here. That's the win." "Consistency is quiet — keep stacking days." "Not every day is epic, but every day adds up." "Grinding even when life is full — proud of you." "Small steps in chaos still move mountains." "You're allowed to be busy AND keep the streak." )
          RANDOM_QUOTE="${QUOTES[$((RANDOM % ${#QUOTES[@]}))]}"
          echo "$TODAY | $RANDOM_QUOTE" >> busy-motivation.md
          git add busy-motivation.md

          SNIPPETS=( "-- $TODAY busy learn\nSELECT 'Still trying' AS mindset FROM dual;" "// $TODAY quick JS\nconsole.log('Busy but breathing — commit #${{ github.run_number }}');" "-- $TODAY simple\nBEGIN DBMS_OUTPUT.PUT_LINE('One line at a time'); END;" "// $TODAY null check\nconst val = null ?? 'default when busy';" )
          RANDOM_SNIPPET="${SNIPPETS[$((RANDOM % ${#SNIPPETS[@]}))]}"
          echo -e "\n\n\`\`\`\n$RANDOM_SNIPPET\n\`\`\`" >> busy-snippets.md
          git add busy-snippets.md

      - name: Debug git status
        run: git status --short

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore(daily): busy-mode auto-commit
            Still not great at Oracle/JS... but didn't skip today 💪
          branch: main
          skip_dirty_check: true  # Force for first tests if needed
